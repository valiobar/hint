server {
    listen 80;

    # loader.js is the only stable URL host pages name. It must never be
    # cached: every page load re-fetches it, reads the current hashed
    # bundle name, and injects that. A new deploy therefore reaches
    # already-embedded customers on their next navigation — no CDN purge
    # and no snippet change. `no-store` (not `no-cache`) means: do not
    # store a copy, do not serve a stale one from disk.
    location = /embed/v1/loader.js {
        root /usr/share/nginx/html;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "no-store" always;
    }

    # Content-hashed JS + CSS. The hash is the content; if the bytes
    # change, the filename changes. Safe to cache for a year. Old hashes
    # left in browser caches are simply never requested again.
    location ~ ^/embed/v1/hint-widget\.[a-f0-9]+\.(js|css)$ {
        root /usr/share/nginx/html;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
