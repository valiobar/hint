name: hint

# Local / POC compose: builds from source (`docker compose up --build`).
# Production pulls GHCR images via infrastructure/docker-compose.yml + deploy.sh.
# See docs/deployment.md.

services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    networks: [hint-network]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10

  chromadb:
    image: chromadb/chroma:0.5.23
    volumes:
      - chroma-data:/chroma/chroma
    networks: [hint-network]

  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      - MONGODB_URL=mongodb://mongo:27017/hint
      - MONGODB_DB_NAME=hint
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-deepseek}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-flash}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - JWT_SECRET=${JWT_SECRET:-dev-insecure-secret-change-me}
      - ACCESS_TOKEN_TTL_MINUTES=${ACCESS_TOKEN_TTL_MINUTES:-720}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@hint.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ADMIN_UI_URL=${ADMIN_UI_URL:-http://localhost:3001}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/v1/auth/google/callback}
      - POLAR_ACCESS_TOKEN=${POLAR_ACCESS_TOKEN:-}
      - POLAR_WEBHOOK_SECRET=${POLAR_WEBHOOK_SECRET:-}
      - POLAR_ENVIRONMENT=${POLAR_ENVIRONMENT:-sandbox}
      - POLAR_PRODUCT_ID_BASIC=${POLAR_PRODUCT_ID_BASIC:-}
      - POLAR_PRODUCT_ID_PRO=${POLAR_PRODUCT_ID_PRO:-}
    depends_on:
      mongo:
        condition: service_healthy
      chromadb:
        condition: service_started
    networks: [hint-network]

  admin:
    build:
      context: ./admin
      args:
        VITE_API_URL: "${VITE_API_URL:-http://localhost:8000}"
        VITE_WIDGET_CDN_URL: "${VITE_WIDGET_CDN_URL:-http://localhost:1337}"
    ports: ["3001:80"]
    depends_on: [backend]
    networks: [hint-network]

  widget-cdn:
    build: ./widget
    ports: ["1337:80"]
    networks: [hint-network]

  demo:
    image: nginx:alpine
    volumes:
      - ./demo:/usr/share/nginx/html:ro
    ports: ["3002:80"]
    depends_on: [widget-cdn]
    networks: [hint-network]

networks:
  hint-network: {}

volumes:
  mongo-data: {}
  chroma-data: {}
