name: hint

# Production Compose stack. App services pull prebuilt GHCR images
# (IMAGE_TAG). Local `up --build` can still use the build: sections.
# Deploy path: IMAGE_TAG=<sha> bash deploy.sh  (never --build on the VPS)

services:
  mongo:
    image: mongo:7
    container_name: hint-mongo
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    networks: [hint-network]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10

  chromadb:
    image: chromadb/chroma:0.5.23
    container_name: hint-chromadb
    volumes:
      - chroma-data:/chroma/chroma
    environment:
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped
    networks: [hint-network]

  backend:
    image: ghcr.io/valiobar/hint-backend:${IMAGE_TAG:-latest}
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: hint-backend
    ports: ["8000:8000"]
    environment:
      - MONGODB_URL=mongodb://mongo:27017/hint
      - MONGODB_DB_NAME=hint
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-deepseek}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-flash}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - JWT_SECRET=${JWT_SECRET}
      - ACCESS_TOKEN_TTL_MINUTES=${ACCESS_TOKEN_TTL_MINUTES:-720}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@hint.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - HINT_CACHE_TTL_SECONDS=${HINT_CACHE_TTL_SECONDS:-3600}
      - HINT_CACHE_MAX_ENTRIES=${HINT_CACHE_MAX_ENTRIES:-1024}
      - ADMIN_UI_URL=${ADMIN_UI_URL:-http://localhost:3001}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/v1/auth/google/callback}
      - POLAR_ACCESS_TOKEN=${POLAR_ACCESS_TOKEN:-}
      - POLAR_WEBHOOK_SECRET=${POLAR_WEBHOOK_SECRET:-}
      - POLAR_ENVIRONMENT=${POLAR_ENVIRONMENT:-sandbox}
      - POLAR_PRODUCT_ID_BASIC=${POLAR_PRODUCT_ID_BASIC:-}
      - POLAR_PRODUCT_ID_PRO=${POLAR_PRODUCT_ID_PRO:-}
    depends_on:
      mongo:
        condition: service_healthy
      chromadb:
        condition: service_started
    restart: unless-stopped
    networks: [hint-network]

  admin:
    image: ghcr.io/valiobar/hint-admin:${IMAGE_TAG:-latest}
    build:
      context: ../admin
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "${VITE_API_URL:-http://localhost:8000}"
        VITE_WIDGET_CDN_URL: "${VITE_WIDGET_CDN_URL:-http://localhost:1337}"
    container_name: hint-admin
    ports: ["3001:80"]
    depends_on: [backend]
    restart: unless-stopped
    networks: [hint-network]

  widget-cdn:
    image: ghcr.io/valiobar/hint-widget:${IMAGE_TAG:-latest}
    build:
      context: ../widget
      dockerfile: Dockerfile
    container_name: hint-widget
    ports: ["1337:80"]
    restart: unless-stopped
    networks: [hint-network]

  demo:
    image: ghcr.io/valiobar/hint-demo:${IMAGE_TAG:-latest}
    build:
      context: ../demo
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "${VITE_API_URL:-http://localhost:8000}"
        VITE_WIDGET_CDN_URL: "${VITE_WIDGET_CDN_URL:-http://localhost:1337}"
    container_name: hint-demo
    ports: ["3002:80"]
    depends_on: [widget-cdn]
    restart: unless-stopped
    networks: [hint-network]

networks:
  hint-network: {}

volumes:
  mongo-data: {}
  chroma-data: {}
